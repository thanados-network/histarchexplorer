<script> {# Tabulator Table Initialisation #}
    //columns for table
    let beginDBP{{tab_name}} = null
    let endDBP{{tab_name}} = null
    let type_id{{tab_name}} = null
    let type_value{{tab_name}} = false


    const {{ tab_name }}data = {{ tab_name }}Data;

    const {{ tab_name }}hasBeginField = Array.isArray({{ tab_name }}data.fields) && {{ tab_name }}data.fields.includes("begin");
    const {{ tab_name }}hasEndField = Array.isArray({{ tab_name }}data.fields) && {{ tab_name }}data.fields.includes("end");

    const {{ tab_name }}timeline = {{ tab_name }}data.timelineBegin;
    const {{ tab_name }}timelineEnd = {{ tab_name }}data.timelineEnd;

    const {{ tab_name }}hasDifferentBeginValues =
        Array.isArray({{ tab_name }}timeline) &&
        {{ tab_name }}timeline.length > 1 &&
        {{ tab_name }}timeline[0]?.string !== {{ tab_name }}timeline[{{ tab_name }}timeline.length - 1]?.string;

    const {{ tab_name }}hasDifferentEndValues =
        Array.isArray({{ tab_name }}timelineEnd) &&
        {{ tab_name }}timelineEnd.length > 1 &&
        {{ tab_name }}timelineEnd[0]?.string !== {{ tab_name }}timelineEnd[{{ tab_name }}timelineEnd.length - 1]?.string;


    if ({{ tab_name }}hasBeginField && {{ tab_name }}hasDifferentBeginValues) {
        document
            .getElementById(`begin-{{ tab_name }}-container`)
            ?.classList.remove("d-none");
    }
    if ({{ tab_name }}Data.fields.includes("end")) {
        document.getElementById("end-{{ tab_name }}-container").classList.remove("d-none")
    }
    if ({{ tab_name }}Data.fields.includes("type")) {
        document.getElementById("{{ tab_name }}TypesButton").classList.remove("d-none")
    }

    const columns{{ tab_name }} = [
        {
            title: "Name",
            field: "name",
            headerSort: true,
            minWidth: 450,
            formatter: function (cell) {
                const data = cell.getRow().getData();
                const id = data.id;
                const name = data.name;
                const begin = data.begin;
                const end = data.end;
                const description = translateDescription(data.description);
                let localBeginDate = ''
                let localEndDate = ''
                let dateString = '';
                if (begin) {
                    localBeginDate = data.beginString
                    dateString += localBeginDate;
                    beginDBP{{tab_name}} = data.beginDBP;
                }

                if (end) {
                    localEndDate = data.endString;
                }

                if (begin && end && localBeginDate !== localEndDate) {
                    dateString += " - ";
                }
                if (end && localEndDate !== localBeginDate) {
                    dateString += data.endString;
                    endDBP{{tab_name}} = data.endDBP;
                }

                let hoverTitle = `${name || ''} ${dateString ? '(' + dateString + ')' : ''}`.trim();

                if (description) {
                    hoverTitle += `\n\n${description}`;
                }

                return `<div title="${hoverTitle}">` +
                    `<span>${name}</span><br>` +
                    `<span class="name-column-date-subtitle">${dateString}</span>` +
                    `</div>`;
            }
        },
        {
            title: "Category",
            field: "class",
            headerSort: false,
            maxWidth: 450,
            minWidth: 450,
            formatter: function (cell) {
                const data = cell.getRow().getData();
                let classValue = data.class;
                let typeValue = data.type;

                let leftContent = '';
                let rawClass = '';
                if (classValue) {
                    rawClass = classValue;
                    leftContent = classValue.charAt(0).toUpperCase() + classValue.slice(1);
                }

                let rightContent = '';
                let rawType = '';
                if (typeValue) {
                    type_value{{tab_name}} = true
                    rawType = typeValue;
                    rightContent = typeValue;
                }

                let combinedHtml = '';

                if (leftContent) {
                    combinedHtml += `<span>${leftContent}</span>`;
                }
                if (rightContent) {
                    combinedHtml += `<br><i class="category-column-type-subtitle">${rightContent}</i>`;
                }

                if (leftContent || rightContent) {
                    combinedHtml += `<div class="tabulator-cell-clearfix"></div>`;
                }

                let hoverTitle = '';
                if (rawClass && rawType) {
                    hoverTitle = `${leftContent} / ${rawType}`;
                } else if (rawClass) {
                    hoverTitle = rawClass;
                } else if (rawType) {
                    hoverTitle = rawType;
                }


                return `<div title="${hoverTitle}">` +
                    combinedHtml +
                    `</div>`;
            }
        },
        {
            title: "Begin",
            field: "begin",
            visible: false
        },
        {
            title: "End",
            field: "end",
            visible: false
        },
        {
            title: "BeginDBP",
            field: "beginDBP",
            visible: false,
            sorterParams: {alignEmptyValues: "bottom"}
        },
        {
            title: "EndDBP",
            field: "endDBP",
            visible: false,
            sorterParams: {alignEmptyValues: "bottom"}
        },
        {
            title: "TypeId",
            field: "type_id",
            visible: false
        },
        {
            title: "Type",
            field: "type",
            visible: false,
            sorterParams: {alignEmptyValues: "bottom"}
        },
        {
            title: "all",
            field: "all",
            visible: false
        }
    ];

    function update{{ tab_name }}Counter() {
        const total = (typeof window.{{ tab_name }}TotalCount === 'number')
            ? window.{{ tab_name }}TotalCount
            : table{{ tab_name }}.getDataCount();
        const el = document.getElementById("{{ tab_name }}-subcount");
        if (el && total !== undefined) {
            el.textContent = ` (${total})`;
        }
    }

    {% if subunits %}
    const tabulatorConfig{{ tab_name }} = {
        layout: "fitColumns",
        responsiveLayout: "collapse",
        height: "calc( 100vh - 100px - 4rem)",
        data: {{ tab_name }}Data.tableData,
        pagination: "local",
        paginationSize: 50,
        paginationSizeSelector: [20, 50, 100],
        columns: columns{{ tab_name }},
        initialSort: [
            { column: "name", dir: "asc" }
        ],
        dataLoaded: function () {
            update{{ tab_name }}Counter();
        }
    };
    {% else %}
    function buildBrowseApiUrl{{ tab_name }}(url, params) {
        const urlObj = new URL(url, window.location.origin);
        urlObj.searchParams.set("page", params.page || 1);
        urlObj.searchParams.set("size", params.size || 50);

        if (params.sorters && params.sorters.length > 0) {
            const col = params.sorters[0].field || params.sorters[0].column;
            const dir = params.sorters[0].dir || "asc";
            urlObj.searchParams.set("sort_field", col);
            urlObj.searchParams.set("sort_dir", dir);
        }

        if (params.filter && Array.isArray(params.filter)) {
            params.filter.forEach(f => {
                if (Array.isArray(f)) {
                    f.forEach(sf => {
                        if (sf.field === "beginDBP" && sf.type === ">=") {
                            urlObj.searchParams.set("begin_min", sf.value);
                        }
                        if (sf.field === "beginDBP" && sf.type === "<=") {
                            urlObj.searchParams.set("begin_max", sf.value);
                        }
                        if (sf.field === "endDBP" && sf.type === ">=") {
                            urlObj.searchParams.set("end_min", sf.value);
                        }
                        if (sf.field === "endDBP" && sf.type === "<=") {
                            urlObj.searchParams.set("end_max", sf.value);
                        }
                    });
                } else if (f && f.field) {
                    if (f.field === "all") {
                        urlObj.searchParams.set("query", f.value);
                    } else if (f.field === "class") {
                        const val = Array.isArray(f.value) ? f.value.join(",") : f.value;
                        urlObj.searchParams.set("classes", val);
                    } else if (f.field === "type_id") {
                        const val = Array.isArray(f.value) ? f.value.join(",") : f.value;
                        urlObj.searchParams.set("types", val);
                    } else if (f.field === "id") {
                        const val = Array.isArray(f.value) ? f.value.join(",") : f.value;
                        urlObj.searchParams.set("entity_ids", val);
                    } else if (f.field === "beginDBP") {
                        if (f.type === ">=") urlObj.searchParams.set("begin_min", f.value);
                        if (f.type === "<=") urlObj.searchParams.set("begin_max", f.value);
                    } else if (f.field === "endDBP") {
                        if (f.type === ">=") urlObj.searchParams.set("end_min", f.value);
                        if (f.type === "<=") urlObj.searchParams.set("end_max", f.value);
                    }
                }
            });
        }
        return urlObj.toString();
    }

    function handleBrowseApiResponse{{ tab_name }}(response) {
        if (!response) return { data: [], last_page: 1 };

        if (typeof response.total === "number") {
            window.{{ tab_name }}TotalCount = response.total;
            const subcountEl = document.getElementById("{{ tab_name }}-subcount");
            if (subcountEl) {
                subcountEl.textContent = ` (${response.total})`;
            }
        }

        if (response.data && Array.isArray(response.data)) {
            response.data.forEach(entity => {
                entity.beginDBP = calculateTimeBP(entity.begin);
                entity.endDBP = calculateTimeBP(entity.end);
                if (entity.begin) entity.beginString = makeLocalDate(entity.begin).localdate;
                if (entity.end) entity.endString = makeLocalDate(entity.end).localdate;

                entity.all = [entity.description, entity.class, entity.type, entity.name]
                    .filter(v => v !== null && v !== undefined && v !== '')
                    .map(v => v.replace(/[\r\n]+/g, ' '))
                    .join(' ');
            });
        }

        return {
            data: response.data || [],
            last_page: response.last_page || 1
        };
    }

    const tabulatorConfig{{ tab_name }} = {
        layout: "fitColumns",
        responsiveLayout: "collapse",
        height: "calc( 100vh - 100px - 4rem)",
        pagination: true,
        paginationMode: "remote",
        filterMode: "remote",
        sortMode: "remote",
        paginationSize: 50,
        paginationSizeSelector: [20, 50, 100],
        ajaxURL: "/api/browse/{{ tab_name }}{% if entity_id %}?id={{ entity_id }}{% endif %}",
        ajaxURLGenerator: function(url, config, params) {
            return buildBrowseApiUrl{{ tab_name }}(url, params);
        },
        ajaxResponse: function(url, params, response) {
            return handleBrowseApiResponse{{ tab_name }}(response);
        },
        columns: columns{{ tab_name }},
        initialSort: [
            { column: "name", dir: "asc" }
        ]
    };
    {% endif %}

    const table{{ tab_name }} = new Tabulator("#table-{{ tab_name }}", tabulatorConfig{{ tab_name }});

    table{{ tab_name }}.on("dataFiltered", update{{ tab_name }}Counter);
    table{{ tab_name }}.on("dataSorted", update{{ tab_name }}Counter);
    table{{ tab_name }}.on("pageLoaded", update{{ tab_name }}Counter);
    table{{ tab_name }}.on("tableBuilt", update{{ tab_name }}Counter);

    table{{ tab_name }}.on("rowClick", function (e, row) {
        const rowData = row.getData();
        const id = rowData.id;

        if (id) {
            const url = `/entity/${id}`;
            window.location.href = url;
        }
    });

</script> {# Tabulator Table Initialisation #}
