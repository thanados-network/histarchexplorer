// DYNAMIC TREE FILTERING FUNCTIONS

// Function to get filtered data based on current search
function getFilteredTableData{{ tab_name }}() {
    const textValue = document.getElementById(`filterInput{{tab_name}}`).value.trim();
    const checkboxes = document.querySelectorAll(`#classSelect{{tab_name}} input[type="checkbox"]:checked`);
    const CsCheckboxes = document.querySelectorAll(`#csSelect{{tab_name}} input[type="checkbox"]:checked`);
    const selectedClasses = Array.from(checkboxes).map(cb => cb.value);
    const selectedCaseStudies = Array.from(CsCheckboxes).map(cb => cb.value);

    let filteredData = {{ tab_name }}Data.tableData;

    // Apply text filter
    if (textValue) {
        filteredData = filteredData.filter(item =>
            item.all && item.all.toLowerCase().includes(textValue.toLowerCase())
        );
    }

    // Apply class filter
    if (selectedClasses.length > 0) {
        filteredData = filteredData.filter(item =>
            selectedClasses.includes(item.class)
        );
    }

    //Apply Case Study Filter
    let caseStudyEntIdArray = new Set(); // Initialize the Set outside the block if it's used globally

    if (selectedCaseStudies.length > 0) {
        const selectedCsIdSet = new Set(selectedCaseStudies.map(id => parseInt(id)));

        const allEntityIds = data.cs_ids.flatMap((cs) => {
            if (selectedCsIdSet.has(cs.id)) {
                return cs.ids.flat();
            }
            return [];
        });

        caseStudyEntIdArray = Array.from(new Set(allEntityIds.map(id => Number(id))));
        filteredData = filteredData.filter(item =>
            caseStudyEntIdArray.includes(item.id)
        );
    }


    // Apply date range filters if they exist
    if ({{ tab_name }}Data.fields.includes("begin") && typeof sliderBegin{{ tab_name }} !== 'undefined' && sliderBegin{{ tab_name }}.noUiSlider) {
        const beginSliderValues = sliderBegin{{ tab_name }}.noUiSlider.get();
        const [beginMin, beginMax] = getDaysBPBfromString(beginSliderValues, {{ tab_name }}Data.timelineBegin);

        if (!isNaN(beginMin) && !isNaN(beginMax)) {
            filteredData = filteredData.filter(item =>
                (item.beginDBP === null || item.beginDBP === undefined) ||
                (item.beginDBP >= beginMin && item.beginDBP <= beginMax)
            );
        }
    }

    if ({{ tab_name }}Data.fields.includes("end") && typeof sliderEnd{{ tab_name }} !== 'undefined' && sliderEnd{{ tab_name }}.noUiSlider) {
        const endSliderValues = sliderEnd{{ tab_name }}.noUiSlider.get();
        const [endMin, endMax] = getDaysBPBfromString(endSliderValues, {{ tab_name }}Data.timelineEnd);

        if (!isNaN(endMin) && !isNaN(endMax)) {
            filteredData = filteredData.filter(item =>
                (item.endDBP === null || item.endDBP === undefined) ||
                (item.endDBP >= endMin && item.endDBP <= endMax)
            );
        }
    }

    return filteredData;
}

// Function to get type IDs that should be shown in tree (including ancestors)
function getValidTypeIdsWithAncestors{{ tab_name }}(filteredData, treeData) {
    const resultTypeIds = [...new Set(filteredData.map(item => item.type_id))];
    const validTypeIds = new Set();

    // Helper function to find all ancestors of a node
    function findAncestors(nodeId, tree) {
        for (const node of tree) {
            if (node.id === nodeId) {
                return [nodeId];
            }
            if (node.children && node.children.length > 0) {
                const childResult = findAncestors(nodeId, node.children);
                if (childResult.length > 0) {
                    return [node.id, ...childResult];
                }
            }
        }
        return [];
    }

    // For each result type ID, find its ancestors and add them all
    for (const tree in treeData) {
        for (const typeId of resultTypeIds) {
            const ancestors = findAncestors(typeId, treeData[tree]);
            ancestors.forEach(ancestorId => validTypeIds.add(ancestorId));
        }
    }

    return validTypeIds;
}

// Function to mark tree nodes as available/unavailable using selectable property
function markTreeDataAvailability{{ tab_name }}(treeData, validTypeIds) {
    function markNodes(nodes) {
        return nodes.map(node => {
            const nodeCopy = {...node}; // Create a copy

            // Set selectable based on availability - library will handle the rest!
            nodeCopy.selectable = validTypeIds.has(node.id);

            // Process children recursively
            if (node.children && node.children.length > 0) {
                nodeCopy.children = markNodes(node.children);
            }

            return nodeCopy;
        });
    }

    const markedTreeData = {};
    for (const tree in treeData) {
        markedTreeData[tree] = markNodes(treeData[tree]);
    }

    return markedTreeData;
}

// Enhanced CSS to make unavailable nodes more visually distinct
function addEnhancedUnavailableStyles{{ tab_name }}() {
    if (!document.getElementById('enhanced-unavailable-styles-{{ tab_name }}')) {
        const styleElement = document.createElement('style');
        styleElement.id = 'enhanced-unavailable-styles-{{ tab_name }}';
        styleElement.textContent = `
                /* Enhance the existing .not-selectable class */
                .custom-treeview-wrapper .treeview-node-content.not-selectable {
                    opacity: 0.6 !important; /* More faded than default 0.6 */
                    font-style: italic !important;
                }

                /* Also grey out the checkbox if present */
                .custom-treeview-wrapper .treeview-node-content.not-selectable .treeview-checkbox {
                    opacity: 0.4 !important;
                }
            `;
        document.head.appendChild(styleElement);
    }
}

// Function to rebuild a single tree with filtered data
function rebuildTreeWithFilteredData{{ tab_name }}(tree) {
    const filteredData = getFilteredTableData{{ tab_name }}();
    const validTypeIds = getValidTypeIdsWithAncestors{{ tab_name }}(filteredData, {{ tab_name }}Data.treeData);

    // Mark unavailable nodes as non-selectable - library handles the styling!
    const markedTreeData = markTreeDataAvailability{{ tab_name }}({{ tab_name }}Data.treeData, validTypeIds);

    // Add our enhanced styling
    addEnhancedUnavailableStyles{{ tab_name }}();

    const treeContainer = document.getElementById(`{{ tab_name }}Tree${tree}`);
    if (!treeContainer) return; // Safety check

    // Store current selection before rebuilding
    const currentInstance = window.{{ tab_name }}TreeInstances[tree];
    const currentSelection = currentInstance ? {
        selectedNodeIds: currentInstance.selectedNodeIds || [],
        selectedNodeIdsWithChildren: currentInstance.selectedNodeIdsWithChildren || []
    } : {selectedNodeIds: [], selectedNodeIdsWithChildren: []};

    treeContainer.innerHTML = '';

    // Create Treeview with marked data (unavailable nodes have selectable: false)
    const treeview = new Treeview({
        containerId: `{{ tab_name }}Tree${tree}`,
        data: markedTreeData[tree][0].children, // Library will automatically apply .not-selectable class, remove root node
        searchEnabled: true,
        buttonStyle: 'bootstrapIcons',
        nodeNameKey: 'label',
        initiallyExpanded: false,
        checkboxSelectionEnabled: true,
        multiSelectEnabled: true,
        showExpandCollapseAllButtons: true,
        showSelectAllButton: true,
        showInvertSelectionButton: true,
        onSelectionChange: (selectedNodesData) => {
            // Only available nodes will be selectable, so no filtering needed here
            window.{{ tab_name }}TreeInstances[tree].selectedNodeIds = selectedNodesData.map(node => node.id);
            window.{{ tab_name }}TreeInstances[tree].selectedNodeIdsWithChildren = treeview.getSelectedNodesAndChildrenValues('id');
        }
    });

    window.{{ tab_name }}TreeInstances[tree] = treeview;
    window.{{ tab_name }}TreeInstances[tree].selectedNodeIds = [];
    window.{{ tab_name }}TreeInstances[tree].selectedNodeIdsWithChildren = [];

    // Restore selections that are still available
    if (currentSelection.selectedNodeIds.length > 0) {
        const validSelections = currentSelection.selectedNodeIds.filter(id => validTypeIds.has(id));
        if (validSelections.length > 0) {
            try {
                validSelections.forEach(id => treeview.selectNodeById(id, true));
                window.{{ tab_name }}TreeInstances[tree].selectedNodeIds = validSelections;
            } catch (e) {
                //console.log('Could not restore selections:', e);
            }
        }
    }
}


// Apply a predefined filter preset programmatically
function applyPreset{{ tab_name }}(preset) {
    const fp = preset.filter_parameters || {};

    // --- Reset all filters first ---
    document.getElementById('filterInput{{ tab_name }}').value = '';

    document.querySelectorAll(`#csSelect{{tab_name}} input[type="checkbox"]`)
        .forEach(cb => { cb.checked = false; });

    document.querySelectorAll(`#classSelect{{tab_name}} input[type="checkbox"]`)
        .forEach(cb => { cb.checked = false; });

    const resetBeginEl{{ tab_name }} = document.getElementById(
        'sliderBegin{{ tab_name }}');
    if (resetBeginEl{{ tab_name }}?.noUiSlider) {
        const beginVals{{ tab_name }} =
            {{ tab_name }}Data.timelineBegin.map(e => e.string);
        resetBeginEl{{ tab_name }}.noUiSlider.set(
            [beginVals{{ tab_name }}[0],
             beginVals{{ tab_name }}[beginVals{{ tab_name }}.length - 1]]);
    }

    const resetEndEl{{ tab_name }} = document.getElementById(
        'sliderEnd{{ tab_name }}');
    if (resetEndEl{{ tab_name }}?.noUiSlider) {
        const endVals{{ tab_name }} =
            {{ tab_name }}Data.timelineEnd.map(e => e.string);
        resetEndEl{{ tab_name }}.noUiSlider.set(
            [endVals{{ tab_name }}[0],
             endVals{{ tab_name }}[endVals{{ tab_name }}.length - 1]]);
    }

    const resetNoBegin{{ tab_name }} = document.getElementById(
        'includeNoBegin{{ tab_name }}');
    if (resetNoBegin{{ tab_name }}) resetNoBegin{{ tab_name }}.checked = true;

    const resetNoEnd{{ tab_name }} = document.getElementById(
        'includeNoEnd{{ tab_name }}');
    if (resetNoEnd{{ tab_name }}) resetNoEnd{{ tab_name }}.checked = true;

    for (const tree of {{ tab_name }}TreesToBuild) {
        const inst = window.{{ tab_name }}TreeInstances[tree];
        if (inst) {
            inst.getSelectedNodes().forEach(n => inst.selectNodeById(n.id, false));
            inst.selectedNodeIds = [];
            inst.selectedNodeIdsWithChildren = [];
        }
        const subCb = document.getElementById(
            `include-subcategories-{{ tab_name }}-${tree}`);
        if (subCb) subCb.checked = false;
    }

    // --- Case study checkboxes ---
    document.querySelectorAll(`#csSelect{{tab_name}} input[type="checkbox"]`)
        .forEach(cb => {
            cb.checked = fp.case_study_ids
                ? fp.case_study_ids.map(String).includes(cb.value)
                : false;
        });

    // --- Class checkboxes ---
    document.querySelectorAll(`#classSelect{{tab_name}} input[type="checkbox"]`)
        .forEach(cb => {
            cb.checked = fp.classes
                ? fp.classes.includes(cb.value)
                : false;
        });

    // --- Begin date slider ---
    const sliderBeginEl{{ tab_name }} = document.getElementById(
        'sliderBegin{{ tab_name }}');
    if (sliderBeginEl{{ tab_name }}?.noUiSlider) {
        const vals = sliderBeginEl{{ tab_name }}.noUiSlider.get();
        const from = fp.begin_from !== undefined ? fp.begin_from : vals[0];
        const to = fp.begin_to !== undefined ? fp.begin_to : vals[1];
        sliderBeginEl{{ tab_name }}.noUiSlider.set([from, to]);
    }

    // --- End date slider ---
    const sliderEndEl{{ tab_name }} = document.getElementById(
        'sliderEnd{{ tab_name }}');
    if (sliderEndEl{{ tab_name }}?.noUiSlider) {
        const vals = sliderEndEl{{ tab_name }}.noUiSlider.get();
        const from = fp.end_from !== undefined ? fp.end_from : vals[0];
        const to = fp.end_to !== undefined ? fp.end_to : vals[1];
        sliderEndEl{{ tab_name }}.noUiSlider.set([from, to]);
    }

    // --- Include no-date checkboxes ---
    const noBeginCb{{ tab_name }} = document.getElementById(
        'includeNoBegin{{ tab_name }}');
    if (noBeginCb{{ tab_name }}) {
        noBeginCb{{ tab_name }}.checked =
            fp.include_no_begin !== undefined ? fp.include_no_begin : true;
    }
    const noEndCb{{ tab_name }} = document.getElementById(
        'includeNoEnd{{ tab_name }}');
    if (noEndCb{{ tab_name }}) {
        noEndCb{{ tab_name }}.checked =
            fp.include_no_end !== undefined ? fp.include_no_end : true;
    }

    // --- Type tree selection ---
    // First deselect all trees
    for (const tree of {{ tab_name }}TreesToBuild) {
        const inst = window.{{ tab_name }}TreeInstances[tree];
        if (inst) {
            inst.getSelectedNodes().forEach(n => inst.selectNodeById(n.id, false));
            inst.selectedNodeIds = [];
            inst.selectedNodeIdsWithChildren = [];
        }
    }

    if (fp.type_ids && fp.type_ids.length > 0) {
        for (const tree of {{ tab_name }}TreesToBuild) {
            const inst = window.{{ tab_name }}TreeInstances[tree];
            if (!inst) continue;
            fp.type_ids.forEach(id => {
                try { inst.selectNodeById(id, true); } catch (e) { /* not in this tree */ }
            });
            inst.selectedNodeIds = inst.getSelectedNodes().map(n => n.id);
            inst.selectedNodeIdsWithChildren =
                inst.getSelectedNodesAndChildrenValues('id');

            // Honour include_subtypes via the checkbox
            const subCb = document.getElementById(
                `include-subcategories-{{ tab_name }}-${tree}`);
            if (subCb) subCb.checked = fp.include_subtypes !== false;
        }
    }

    // --- Tab visibility ---
    if (Array.isArray(preset.tabs) && preset.tabs.length > 0) {
        tabsToLoad.forEach(tab => {
            const isVisible = preset.tabs.includes(tab);
            document.querySelectorAll(`.to-remove-${tab}`).forEach(el => {
                el.classList.toggle('d-none', !isVisible);
            });
        });
    } else {
        tabsToLoad.forEach(tab => {
            document.querySelectorAll(`.to-remove-${tab}`).forEach(el => {
                el.classList.remove('d-none');
            });
        });
    }

    // Rebuild selectedNodes and apply
    filterTypes{{ tab_name }}();
}

// applyCombinedFilter function
function applyCombinedFilter{{ tab_name }}() {
    const textValue = document.getElementById(`filterInput{{tab_name}}`).value.trim();
    const checkboxes = document.querySelectorAll(`#classSelect{{tab_name}} input[type="checkbox"]:checked`);
    const selectedClasses = Array.from(checkboxes).map(cb => cb.value);
    const CsCheckboxes = document.querySelectorAll(`#csSelect{{tab_name}} input[type="checkbox"]:checked`);
    const selectedCaseStudies = Array.from(CsCheckboxes).map(cb => cb.value);
    const filters = [];

    // Type filter
    if (selectedNodes{{ tab_name }}.length > 0) {
        filters.push({
            field: "type_id",
            type: "in",
            value: selectedNodes{{ tab_name }}
        });
    }

    // Text filter
    if (textValue) {
        filters.push({
            field: "all",
            type: "like",
            value: textValue
        });
    }

    // Class filter
    if (selectedClasses.length > 0) {
        filters.push({
            field: "class",
            type: "in",
            value: selectedClasses
        });
    }


    //caseStudyFilter
    let caseStudyEntIdArray = new Set(); // Initialize the Set outside the block if it's used globally

    if (selectedCaseStudies.length > 0) {
        const selectedCsIdSet = new Set(selectedCaseStudies.map(id => parseInt(id)));

        const allEntityIds = data.cs_ids.flatMap((cs) => {
            if (selectedCsIdSet.has(cs.id)) {
                return cs.ids.flat();
            }
            return [];
        });

        caseStudyEntIdArray = Array.from(new Set(allEntityIds.map(id => Number(id))));
        filters.push({
            field: "id",
            type: "in",
            value: caseStudyEntIdArray
        });
    }

    // Begin date filter
    if (
        {{ tab_name }}Data.fields.includes("begin") &&
        typeof sliderBegin{{ tab_name }} !== 'undefined' &&
        sliderBegin{{ tab_name }}.noUiSlider
    ) {
        const beginSliderValues = sliderBegin{{ tab_name }}.noUiSlider.get();
        const [beginMin, beginMax] = getDaysBPBfromString(beginSliderValues, {{ tab_name }}Data.timelineBegin);
        const includeNoBegin = document.getElementById('includeNoBegin{{ tab_name }}').checked;

        if (!isNaN(beginMin) && !isNaN(beginMax)) {
            if (includeNoBegin) {
                // OR group: (in range) OR (null)
                filters.push([
                    {field: "beginDBP", type: ">=", value: beginMin},
                    {field: "beginDBP", type: "=", value: null}
                ]);
                filters.push([
                    {field: "beginDBP", type: "<=", value: beginMax},
                    {field: "endDBP", type: "=", value: null}
                ]);
            } else {
                filters.push({field: "beginDBP", type: ">=", value: beginMin});
                filters.push({field: "beginDBP", type: "<=", value: beginMax});
            }
        }
    }

    // End date filter
    if (
        {{ tab_name }}Data.fields.includes("end") &&
        typeof sliderEnd{{ tab_name }} !== 'undefined' &&
        sliderEnd{{ tab_name }}.noUiSlider
    ) {
        const endSliderValues = sliderEnd{{ tab_name }}.noUiSlider.get();
        const [endMin, endMax] = getDaysBPBfromString(endSliderValues, {{ tab_name }}Data.timelineEnd);
        const includeNoEnd = document.getElementById('includeNoEnd{{ tab_name }}').checked;

        if (!isNaN(endMin) && !isNaN(endMax)) {
            if (includeNoEnd) {
                // OR group: (in range) OR (null)
                filters.push([
                    {field: "endDBP", type: ">=", value: endMin},
                    {field: "endDBP", type: "=", value: null}
                ]);
                filters.push([
                    {field: "endDBP", type: "<=", value: endMax},
                    {field: "endDBP", type: "=", value: null}
                ]);
            } else {
                filters.push({field: "endDBP", type: ">=", value: endMin});
                filters.push({field: "endDBP", type: "<=", value: endMax});
            }
        }
    }

    // Apply filters
    if (filters.length > 0) {
        table{{ tab_name }}.setFilter(filters);
    } else {
        table{{ tab_name }}.clearFilter();
    }
    update{{ tab_name }}Counter()
}

const {{ tab_name }}TreesToBuild = Object.keys({{ tab_name }}Data.treeData);
//console.log({{ tab_name }}TreesToBuild);

const {{ tab_name }}CurrentContainer = document.getElementById("{{ tab_name }}-tree-container");

if (!window.{{ tab_name }}TreeInstances) {
    window.{{ tab_name }}TreeInstances = {};
}

for (const tree of {{ tab_name }}TreesToBuild) {
    const treeLabel = tree.replace('_', ' ').replace(/^./, c => c.toUpperCase());

    const accordionItem = document.createElement('div');
    accordionItem.classList.add('accordion-item');
    accordionItem.innerHTML = `
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#typesCollapse{{ tab_name }}${tree}">
                ${treeLabel} types
            </button>
        </h2>
        <div id="typesCollapse{{ tab_name }}${tree}" class="accordion-collapse collapse">
            <div class="p-3">
                <div id="{{ tab_name }}Tree${tree}" class="tree-container typeTreeSelector"></div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="form-check">
                        <input class="form-check-input" checked type="checkbox"
                               id="include-subcategories-{{ tab_name }}-${tree}">
                        <label class="form-check-label" for="include-subcategories-{{ tab_name }}-${tree}">
                            Include subcategories
                        </label>
                    </span>
                    <span>
                        <button type="button" class="btn btn-warning btn-sm filter-btn"
                                id="reset-type-btn-{{ tab_name }}-${tree}">
                            Reset
                        </button>
                        <button type="button" class="btn btn-primary btn-sm filter-btn"
                                id="apply-type-btn-{{ tab_name }}-${tree}">
                            Apply
                        </button>
                    </span>
                </div>
            </div>
        </div>
    `;

    {{ tab_name }}CurrentContainer.appendChild(accordionItem);

    accordionItem.querySelector(`#reset-type-btn-{{ tab_name }}-${tree}`)
        ?.addEventListener('click', () => deselectTree{{ tab_name }}(tree));
    accordionItem.querySelector(`#apply-type-btn-{{ tab_name }}-${tree}`)
        ?.addEventListener('click', () => filterTypes{{ tab_name }}());

    document.getElementById(`typesCollapse{{ tab_name }}${tree}`)
        ?.addEventListener('shown.bs.collapse', () => {
            rebuildTreeWithFilteredData{{ tab_name }}(tree);
        });

    // Create a Treeview instance – store it in an object instead of dynamic variable
    if (!{{ tab_name }}Data.treeData[tree]?.[0]?.children) continue;

    const treeview = new Treeview({
        containerId: `{{ tab_name }}Tree${tree}`,   // ID of the HTML element to render the tree into
        data: {{ tab_name }}Data.treeData[tree][0].children,   // Use bracket notation to access the property, remove root node
        searchEnabled: true,
        buttonStyle: 'bootstrapIcons',
        nodeNameKey: 'label',
        initiallyExpanded: false,
        checkboxSelectionEnabled: true,
        multiSelectEnabled: true,
        showExpandCollapseAllButtons: true,
        showSelectAllButton: true,
        showInvertSelectionButton: true,
        onSelectionChange: (selectedNodesData) => {
            window.{{ tab_name }}TreeInstances[tree].selectedNodeIds = selectedNodesData.map(node => node.id);
            window.{{ tab_name }}TreeInstances[tree].selectedNodeIdsWithChildren = treeview.getSelectedNodesAndChildrenValues('id');
        }
    });

    window.{{ tab_name }}TreeInstances[tree] = treeview;
    window.{{ tab_name }}TreeInstances[tree].selectedNodeIds = []
    window.{{ tab_name }}TreeInstances[tree].selectedNodeIdsWithChildren = []

}

let selectedNodes{{ tab_name }} = [];

// Deselects all currently selected nodes of the given tree of this tab
function deselectTree{{ tab_name }}(tree) {
    const treeInstance = window.{{ tab_name }}TreeInstances[tree];
    if (treeInstance) {
        treeInstance.getSelectedNodes().forEach(node => {
            treeInstance.selectNodeById(node.id, false);
        });
        treeInstance.selectedNodeIds = [];
        treeInstance.selectedNodeIdsWithChildren = [];
    }
    filterTypes{{ tab_name }}();
}

function filterTypes{{ tab_name }}() {
    selectedNodes{{ tab_name }} = [];
    for (const tree of {{ tab_name }}TreesToBuild) {
        const treeInstance = window.{{ tab_name }}TreeInstances[tree];
        if (!treeInstance) continue;
        const checkbox = document.getElementById(`include-subcategories-{{ tab_name }}-${tree}`);
        const includeSubcategories = checkbox ? checkbox.checked : true;
        if (includeSubcategories) {
            selectedNodes{{ tab_name }}.push(...treeInstance.selectedNodeIdsWithChildren);
        } else {
            selectedNodes{{ tab_name }}.push(...treeInstance.selectedNodeIds);
        }
    }
    //console.log(selectedNodes{{ tab_name }})
    applyCombinedFilter{{ tab_name }}()
}


</script> {# Filter Search Sort #}
