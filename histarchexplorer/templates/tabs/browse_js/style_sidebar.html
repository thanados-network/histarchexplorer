{% if tab_name in ['places', 'items'] %}
<div id="style-sidebar-backdrop-{{ tab_name }}" class="style-sidebar-backdrop d-none"></div>
<div id="style-sidebar-{{ tab_name }}" class="style-sidebar d-none">
    <div class="style-sidebar-inner">
        <div class="style-sidebar-header d-flex justify-content-between
                    align-items-center p-2 border-bottom">
            <h5 class="m-0">Layers</h5>
            <button type="button" class="btn-close"
                    id="style-sidebar-close-{{ tab_name }}"
                    aria-label="Close"></button>
        </div>
        <div class="p-3">
            <ul class="list-unstyled m-0"
                id="layer-list-{{ tab_name }}"></ul>
        </div>
    </div>
</div>
<script> {# Style Sidebar Toggle & Layer List #}
    function toggleStyleSidebar{{ tab_name }}() {
        const sidebar = document.getElementById(
            'style-sidebar-{{ tab_name }}');
        sidebar.classList.toggle('open');

        // Show/Hide the toggle button in the map
        const toggleBtn = document.querySelector('.style-sidebar-ctrl-btn');
        if (toggleBtn) {
            const container = toggleBtn.closest('.maplibregl-ctrl');
            if (container) {
                container.classList.toggle('d-none',
                    sidebar.classList.contains('open'));
            }
        }

        setTimeout(() => {
            if (typeof map{{ tab_name }} !== 'undefined' && map{{ tab_name }}) {
                map{{ tab_name }}.resize();
            }
        }, 350);
    }
    function openStyleSidebar{{ tab_name }}() {
        const sidebar = document.getElementById(
            'style-sidebar-{{ tab_name }}');
        if (!sidebar.classList.contains('open')) {
            toggleStyleSidebar{{ tab_name }}();
        }
    }
    function closeStyleSidebar{{ tab_name }}() {
        const sidebar = document.getElementById(
            'style-sidebar-{{ tab_name }}');
        if (sidebar.classList.contains('open')) {
            toggleStyleSidebar{{ tab_name }}();
        }
    }
    document.getElementById('style-sidebar-close-{{ tab_name }}')
        .addEventListener('click', () => closeStyleSidebar{{ tab_name }}());
    document.getElementById('style-sidebar-backdrop-{{ tab_name }}')
        .addEventListener('click', () => closeStyleSidebar{{ tab_name }}());

    const layerDefs{{ tab_name }} = [
        {
            type: 'Point',
            label: 'Point',
            layers: [
                '{{ tab_name }}-layer-circle',
                '{{ tab_name }}-layer-representative-points'
            ],
            svg: `<svg width="20" height="20" viewBox="0 0 20 20"
                       xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="10" r="7" fill="#088"/>
            </svg>`
        },
        {
            type: 'Polygon',
            label: 'Polygon',
            layers: [
                '{{ tab_name }}-layer-fill',
                '{{ tab_name }}-layer-outline'
            ],
            svg: `<svg width="20" height="20" viewBox="0 0 20 20"
                       xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="4" width="16" height="12" rx="1"
                      fill="#088" fill-opacity="0.5"
                      stroke="#004747" stroke-width="1.5"/>
            </svg>`
        },
        {
            type: 'LineString',
            label: 'LineString',
            layers: ['{{ tab_name }}-layer-line'],
            svg: `<svg width="20" height="20" viewBox="0 0 20 20"
                       xmlns="http://www.w3.org/2000/svg">
                <polyline points="2,16 7,6 13,12 18,4"
                          fill="none" stroke="#088" stroke-width="2.5"
                          stroke-linejoin="round"
                          stroke-linecap="round"/>
            </svg>`
        }
    ];

    const hiddenLayerTypes{{ tab_name }} = new Set();
    const hiddenTypes{{ tab_name }} = new Set();
    const hiddenClasses{{ tab_name }} = new Set();

    const defaultStyles{{ tab_name }} = {
        Polygon: {
            fillColor: '#008888',
            outlineColor: '#004747',
            outlineWidth: 1.5,
            opacity: 0.5
        },
        LineString: { color: '#008888', lineWidth: 2.5, opacity: 1 },
        Point: {
            color: '#008888',
            strokeColor: '#000000',
            strokeWidth: 1,
            radius: 7,
            opacity: 1
        }
    };

    const currentStyles{{ tab_name }} = {
        Polygon: Object.assign(
            {}, defaultStyles{{ tab_name }}.Polygon),
        LineString: Object.assign(
            {}, defaultStyles{{ tab_name }}.LineString),
        Point: Object.assign(
            {}, defaultStyles{{ tab_name }}.Point)
    };

    function applyPolygonStyle{{ tab_name }}() {
        const s = currentStyles{{ tab_name }}.Polygon;
        const m = map{{ tab_name }};
        if (m.getLayer('{{ tab_name }}-layer-fill')) {
            m.setPaintProperty(
                '{{ tab_name }}-layer-fill',
                'fill-color', s.fillColor);
            m.setPaintProperty(
                '{{ tab_name }}-layer-fill',
                'fill-opacity', s.opacity);
        }
        if (m.getLayer('{{ tab_name }}-layer-outline')) {
            m.setPaintProperty(
                '{{ tab_name }}-layer-outline',
                'line-color', s.outlineColor);
            m.setPaintProperty(
                '{{ tab_name }}-layer-outline',
                'line-width', s.outlineWidth);
        }
    }

    function applyLineStringStyle{{ tab_name }}() {
        const s = currentStyles{{ tab_name }}.LineString;
        const m = map{{ tab_name }};
        if (m.getLayer('{{ tab_name }}-layer-line')) {
            m.setPaintProperty(
                '{{ tab_name }}-layer-line', 'line-color', s.color);
            m.setPaintProperty(
                '{{ tab_name }}-layer-line',
                'line-width', s.lineWidth);
            m.setPaintProperty(
                '{{ tab_name }}-layer-line',
                'line-opacity', s.opacity);
        }
    }

    function applyPointStyle{{ tab_name }}() {
        const s = currentStyles{{ tab_name }}.Point;
        const m = map{{ tab_name }};
        [
            '{{ tab_name }}-layer-circle',
            '{{ tab_name }}-layer-representative-points'
        ].forEach(lid => {
            if (m.getLayer(lid)) {
                m.setPaintProperty(lid, 'circle-color', s.color);
                m.setPaintProperty(
                    lid, 'circle-radius', s.radius);
                m.setPaintProperty(
                    lid, 'circle-opacity', s.opacity);
                m.setPaintProperty(
                    lid, 'circle-stroke-color', s.strokeColor);
                m.setPaintProperty(
                    lid, 'circle-stroke-width', s.strokeWidth);
            }
        });
    }

    function updateLayerSvg{{ tab_name }}(type) {
        const s = currentStyles{{ tab_name }}[type];
        const def = layerDefs{{ tab_name }}.find(d => d.type === type);
        if (!def) { return; }
        if (type === 'Polygon') {
            def.svg = `<svg width="20" height="20" viewBox="0 0 20 20"
                           xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="4" width="16" height="12" rx="1"
                      fill="${s.fillColor}"
                      fill-opacity="${s.opacity}"
                      stroke="${s.outlineColor}"
                      stroke-width="${s.outlineWidth}"/>
            </svg>`;
        } else if (type === 'LineString') {
            def.svg = `<svg width="20" height="20" viewBox="0 0 20 20"
                           xmlns="http://www.w3.org/2000/svg">
                <polyline points="2,16 7,6 13,12 18,4"
                          fill="none" stroke="${s.color}"
                          stroke-width="${s.lineWidth}"
                          stroke-linejoin="round"
                          stroke-linecap="round"/>
            </svg>`;
        } else if (type === 'Point') {
            def.svg = `<svg width="20" height="20" viewBox="0 0 20 20"
                           xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="10"
                        r="${Math.min(s.radius, 9)}"
                        fill="${s.color}"
                        stroke="${s.strokeColor}"
                        stroke-width="${s.strokeWidth}"/>
            </svg>`;
        }
    }

    function refreshLayerListSvg{{ tab_name }}(type) {
        updateLayerSvg{{ tab_name }}(type);
        const def = layerDefs{{ tab_name }}.find(d => d.type === type);
        if (!def) { return; }
        const list = document.getElementById(
            'layer-list-{{ tab_name }}');
        list.querySelectorAll('.layer-info-btn').forEach(span => {
            const lbl = span.querySelector('span.flex-grow-1');
            if (lbl && lbl.textContent === def.label) {
                const svgWrapper =
                    span.querySelector('span.flex-shrink-0');
                if (svgWrapper) {
                    svgWrapper.innerHTML = def.svg;
                }
            }
        });
    }
    let cachedAllFeatures{{ tab_name }} = [];
    let cachedFilteredFeatures{{ tab_name }} = [];

    function getGeomCategory{{ tab_name }}(geomType) {
        if (geomType === 'Polygon' || geomType === 'MultiPolygon') {
            return 'Polygon';
        }
        if (geomType === 'LineString' || geomType === 'MultiLineString') {
            return 'LineString';
        }
        return 'Point';
    }

    function updateLayerList{{ tab_name }}(features) {
        const counts = { Polygon: 0, LineString: 0, Point: 0 };
        features.forEach(f => {
            const cat = getGeomCategory{{ tab_name }}(f.geometry.type);
            counts[cat]++;
        });

        const list = document.getElementById('layer-list-{{ tab_name }}');
        list.innerHTML = '';
        const fragment = document.createDocumentFragment();

        layerDefs{{ tab_name }}.forEach(def => {
            const count = counts[def.type];
            if (count === 0) return;

            const li = document.createElement('li');
            li.className =
                'layer-list-item flex-column py-1';

            const row = document.createElement('div');
            row.className = 'd-flex align-items-center gap-2 w-100';

            const cbId = `layer-cb-{{ tab_name }}-${def.type}`;
            const isVisible = !hiddenLayerTypes{{ tab_name }}.has(def.type);

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'form-check-input flex-shrink-0 mt-0';
            cb.id = cbId;
            cb.checked = isVisible;
            cb.dataset.layerType = def.type;
            cb.addEventListener('change', (e) => {
                e.stopPropagation();
                if (cb.checked) {
                    hiddenLayerTypes{{ tab_name }}.delete(def.type);
                } else {
                    hiddenLayerTypes{{ tab_name }}.add(def.type);
                }
                applyLayerVisibility{{ tab_name }}();
            });
            cb.addEventListener('click', (e) => e.stopPropagation());

            const cbSpan = document.createElement('span');
            cbSpan.className = 'd-flex align-items-center';
            cbSpan.appendChild(cb);

            const svgWrapper = document.createElement('span');
            svgWrapper.className = 'flex-shrink-0';
            svgWrapper.innerHTML = def.svg;

            const labelEl = document.createElement('span');
            labelEl.className = 'flex-grow-1';
            labelEl.textContent = def.label;

            const badge = document.createElement('span');
            badge.className = 'badge text-bg-secondary ms-1';
            badge.textContent = count;

            const infoSpan = document.createElement('span');
            infoSpan.className =
                'd-flex align-items-center gap-2 flex-grow-1 layer-info-btn';
            infoSpan.appendChild(svgWrapper);
            infoSpan.appendChild(labelEl);
            infoSpan.appendChild(badge);
            infoSpan.addEventListener('click', (e) => {
                const modal = document.getElementById(
                    'layer-style-modal-{{ tab_name }}');
                const bsModal = bootstrap.Modal.getOrCreateInstance(modal);
                modal.dataset.layerType = def.type;
                bsModal.show();
            });

            const toggle = document.createElement('span');
            toggle.className = 'flex-shrink-0 cursor-pointer px-1 d-flex align-items-center';
            toggle.innerHTML = '<i class="bi bi-chevron-down small"></i>';
            toggle.style.transition = 'transform 0.3s ease';
            toggle.dataset.expanded = 'false';

            const legendList = document.createElement('ul');
            legendList.className = 'layer-legend-list list-unstyled ps-4 mt-1 collapse w-100';
            legendList.id = `layer-legend-{{ tab_name }}-${def.type}`;

            const bsCollapse = new bootstrap.Collapse(legendList, {
                toggle: false
            });

            legendList.addEventListener('show.bs.collapse', () => {
                toggle.style.transform = 'rotate(180deg)';
                toggle.dataset.expanded = 'true';
                // Populate legend if empty
                if (legendList.children.length === 0) {
                    const tree = {{ tab_name }}Data.treeData;
                    const hasTree = tree && Object.keys(tree).length > 0;
                    if (hasTree) {
                        buildMultiTypeList{{ tab_name }}(def.type, legendList);
                    } else {
                        buildMultiClassList{{ tab_name }}(def.type, legendList);
                    }
                }
            });

            legendList.addEventListener('hide.bs.collapse', () => {
                toggle.style.transform = 'rotate(0deg)';
                toggle.dataset.expanded = 'false';
            });

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                bsCollapse.toggle();
            });

            row.appendChild(cbSpan);
            row.appendChild(infoSpan);
            row.appendChild(toggle);
            li.appendChild(row);
            li.appendChild(legendList);
            fragment.appendChild(li);
        });

        list.appendChild(fragment);
    }

    function buildClassGeomKey(cls, geomCat) {
        return cls + '||' + geomCat;
    }

    const viewClasses{{ tab_name }} = new Set(
        {{ config['VIEW_CLASSES'].get(tab_name, []) | list | tojson }});

    function getOverviewStats{{ tab_name }}(
            allFeatures, filteredFeatures, geomTypeFilter) {
        const total = {};
        const filtered = {};
        allFeatures.forEach(f => {
            const cls = (f.properties && f.properties.class) || 'Unknown';
            if (!viewClasses{{ tab_name }}.has(cls)) { return; }
            const cat = getGeomCategory{{ tab_name }}(f.geometry.type);
            if (geomTypeFilter && cat !== geomTypeFilter) { return; }
            const key = buildClassGeomKey(cls, cat);
            total[key] = (total[key] || 0) + 1;
        });
        filteredFeatures.forEach(f => {
            const cls = (f.properties && f.properties.class) || 'Unknown';
            if (!viewClasses{{ tab_name }}.has(cls)) { return; }
            const cat = getGeomCategory{{ tab_name }}(f.geometry.type);
            if (geomTypeFilter && cat !== geomTypeFilter) { return; }
            const key = buildClassGeomKey(cls, cat);
            filtered[key] = (filtered[key] || 0) + 1;
        });
        return { total, filtered };
    }

    function formatClassName(cls) {
        return cls.replace(/_/g, ' ')
            .replace(/\b\w/g, c => c.toUpperCase());
    }

    function updateOverview{{ tab_name }}(
            allFeatures, filteredFeatures, geomTypeFilter) {
        cachedAllFeatures{{ tab_name }} = allFeatures;
        cachedFilteredFeatures{{ tab_name }} = filteredFeatures;
        const pane = document.getElementById(
            'pane-overview-{{ tab_name }}');
        const { total, filtered } = getOverviewStats{{ tab_name }}(
            allFeatures, filteredFeatures, geomTypeFilter);
        const keys = Object.keys(total).sort();
        if (keys.length === 0) {
            pane.innerHTML =
                '<p class="text-muted small">No data available.</p>';
            return;
        }
        const fragment = document.createDocumentFragment();
        const table = document.createElement('table');
        table.className = 'table table-sm table-hover mb-0';
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr>' +
            '<th class="text-muted fw-normal small">Class</th>' +
            '<th class="text-muted fw-normal small">Geometry</th>' +
            '<th class="text-muted fw-normal small text-end">Count</th>' +
            '</tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        keys.forEach(key => {
            const parts = key.split('||');
            const cls = parts[0];
            const geomCat = parts[1];
            const tot = total[key] || 0;
            const filt = filtered[key] || 0;
            const tr = document.createElement('tr');
            const tdCls = document.createElement('td');
            tdCls.className = 'small';
            tdCls.textContent = formatClassName(cls);
            const tdGeom = document.createElement('td');
            tdGeom.className = 'small text-muted';
            tdGeom.textContent = geomCat + 's';
            const tdCount = document.createElement('td');
            tdCount.className = 'small text-end';
            tdCount.textContent = filt + ' of ' + tot;
            tr.appendChild(tdCls);
            tr.appendChild(tdGeom);
            tr.appendChild(tdCount);
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        fragment.appendChild(table);
        pane.innerHTML = '';
        pane.appendChild(fragment);
    }

    function applyLayerVisibility{{ tab_name }}() {
        const m = map{{ tab_name }};
        const sel = document.getElementById('multi-color-select-{{ tab_name }}');
        const tree = {{ tab_name }}Data.treeData;
        const hasTree = tree && Object.keys(tree).length > 0;
        const mode = (sel && sel.value) || (hasTree ? 'type' : 'class');

        layerDefs{{ tab_name }}.forEach(def => {
            const isLayerVisible = !hiddenLayerTypes{{ tab_name }}.has(def.type);
            const visibility = isLayerVisible ? 'visible' : 'none';

            def.layers.forEach(layerId => {
                if (!m.getLayer(layerId)) return;

                m.setLayoutProperty(layerId, 'visibility', visibility);

                if (isLayerVisible) {
                    // Apply individual filters for classes/types
                    let filter = ['all'];
                    
                    // Always respect the global ID filter if it exists (it's handled elsewhere but good to be safe)
                    // Actually, the main source is already filtered by IDs.
                    
                    if (mode === 'class') {
                        if (hiddenClasses{{ tab_name }}.size > 0) {
                            const validClasses = [...hiddenClasses{{ tab_name }}].filter(c => c !== null && c !== undefined);
                            if (validClasses.length > 0) {
                                filter.push(['!', ['in', ['get', 'class'], ['literal', validClasses]]]);
                            }
                        }
                    } else if (mode === 'type') {
                        if (hiddenTypes{{ tab_name }}.size > 0) {
                            // Map type_id to entity id match
                            const hiddenEids = [];
                            if ({{ tab_name }}Data && {{ tab_name }}Data.tableData) {
                                {{ tab_name }}Data.tableData.forEach(e => {
                                    if (e.id && e.type_id && hiddenTypes{{ tab_name }}.has(String(e.type_id))) {
                                        hiddenEids.push(e.id);
                                    }
                                });
                            }
                            if (hiddenEids.length > 0) {
                                // Filter out null/undefined IDs just in case
                                const validEids = hiddenEids.filter(id => id !== null && id !== undefined);
                                if (validEids.length > 0) {
                                    // Ensure IDs are numbers if MapLibre expects them based on feature data
                                    const numericEids = validEids.map(id => Number(id)).filter(id => !isNaN(id));
                                    if (numericEids.length > 0) {
                                        filter.push(['!', ['in', ['get', 'id'], ['literal', numericEids]]]);
                                    }
                                }
                            }
                        }
                    }
                    
                    if (filter.length > 1) {
                        try {
                            m.setFilter(layerId, filter);
                        } catch (e) {
                            console.error('Error setting filter for layer ' + layerId, filter, e);
                        }
                    } else {
                        try {
                            // Some versions of MapLibre/Mapbox might prefer a neutral filter over null
                            // for certain layer types if an error persists.
                            m.setFilter(layerId, null);
                        } catch (e) {
                            console.error('Error clearing filter for layer ' + layerId, e);
                        }
                    }
                }
            });
        });
    }
</script>

<div class="modal fade layer-style-modal" id="layer-style-modal-{{ tab_name }}" tabindex="-1"
     aria-labelledby="layer-style-modal-label-{{ tab_name }}"
     aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"
                    id="layer-style-modal-label-{{ tab_name }}">
                    Layer Style</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="d-flex">
                    <div class="nav flex-column nav-pills border-end layer-style-nav-sidebar"
                         id="layer-style-tabs-{{ tab_name }}"
                         role="tablist"
                         aria-orientation="vertical">
                        <button class="nav-link active p-2"
                                id="tab-overview-{{ tab_name }}"
                                data-bs-toggle="pill"
                                data-bs-target="#pane-overview-{{ tab_name }}"
                                type="button" role="tab"
                                title="Overview"
                                data-bs-placement="right"
                                data-bs-toggle-tooltip>
                            <i class="bi bi-info-circle fs-5"></i>
                        </button>
                        <button class="nav-link p-2"
                                id="tab-single-{{ tab_name }}"
                                data-bs-toggle="pill"
                                data-bs-target="#pane-single-{{ tab_name }}"
                                type="button" role="tab"
                                title="Single Color Options"
                                data-bs-placement="right"
                                data-bs-toggle-tooltip>
                            <i class="bi bi-paint-bucket fs-5"></i>
                        </button>
                        <button class="nav-link p-2 d-none"
                                id="tab-multi-{{ tab_name }}"
                                data-bs-toggle="pill"
                                data-bs-target="#pane-multi-{{ tab_name }}"
                                type="button" role="tab"
                                title="Multiple Color Options"
                                data-bs-placement="right"
                                data-bs-toggle-tooltip>
                            <i class="bi bi-palette fs-5"></i>
                        </button>
                        <button class="nav-link p-2"
                                id="tab-gradient-{{ tab_name }}"
                                data-bs-toggle="pill"
                                data-bs-target="#pane-gradient-{{ tab_name }}"
                                type="button" role="tab"
                                title="Gradient Color Options"
                                data-bs-placement="right"
                                data-bs-toggle-tooltip>
                            <i class="bi bi-palette2 fs-5"></i>
                        </button>
                    </div>
                    <div class="tab-content flex-grow-1 p-3"
                         id="layer-style-tab-content-{{ tab_name }}">
                        <div class="tab-pane fade show active"
                             id="pane-overview-{{ tab_name }}"
                             role="tabpanel"
                             aria-labelledby="tab-overview-{{ tab_name }}">
                            <p class="text-muted">Overview – Platzhalter.</p>
                        </div>
                        <div class="tab-pane fade"
                             id="pane-single-{{ tab_name }}"
                             role="tabpanel"
                             aria-labelledby="tab-single-{{ tab_name }}">
                            <div id="single-color-form-{{ tab_name }}">
                                <p class="text-muted small">
                                    Open a layer to edit its style.</p>
                            </div>
                        </div>
                        <div class="tab-pane fade"
                             id="pane-multi-{{ tab_name }}"
                             role="tabpanel"
                             aria-labelledby="tab-multi-{{ tab_name }}">
                            <div class="mb-2 d-none">
                                <label class="form-label small fw-semibold mb-1"
                                       for="multi-color-select-{{ tab_name }}">
                                    Color by Property
                                </label>
                                <select class="form-select form-select-sm"
                                        id="multi-color-select-{{ tab_name }}">
                                    <option value="" disabled selected>
                                        – Select property –
                                    </option>
                                </select>
                            </div>
                            <div id="multi-shared-opts-{{ tab_name }}"></div>
                        </div>
                        <div class="tab-pane fade"
                             id="pane-gradient-{{ tab_name }}"
                             role="tabpanel"
                             aria-labelledby="tab-gradient-{{ tab_name }}">
                            <p class="text-muted">
                                Gradient Color Options – Platzhalter.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script> {# Layer Style Modal – Single Color Form & Tooltips #}
(function () {

    function makeColorRow(labelText, key, styleObj) {
        const row = document.createElement('div');
        row.className = 'mb-3';
        const lbl = document.createElement('label');
        lbl.className = 'form-label small fw-semibold mb-1';
        lbl.textContent = labelText;
        const picker = document.createElement('input');
        picker.type = 'color';
        picker.className = 'form-control form-control-color';
        picker.value = styleObj[key];
        picker.dataset.key = key;
        row.appendChild(lbl);
        row.appendChild(picker);
        return { row, picker };
    }

    function makeRangeRow(labelText, key, styleObj, min, max, step) {
        const row = document.createElement('div');
        row.className = 'mb-3';
        const lbl = document.createElement('label');
        lbl.className = 'form-label small fw-semibold mb-1';
        lbl.textContent = labelText;
        const inputGroup = document.createElement('div');
        inputGroup.className = 'd-flex align-items-center gap-2';
        const range = document.createElement('input');
        range.type = 'range';
        range.className = 'form-range flex-grow-1';
        range.min = min; range.max = max; range.step = step;
        range.value = styleObj[key];
        const numInput = document.createElement('input');
        numInput.type = 'number';
        numInput.className = 'form-control form-control-sm';

    /**
     * Lightens/darkens a color (for type gradations)
     */
    function adjustColor{{ tab_name }}(color, percent) {
        const num = parseInt(color.replace("#", ""), 16);
        // If percent is 0, return original color
        if (percent === 0) return color;
        const amt = Math.round(2.55 * percent);
        const R = (num >> 16) + amt;
        const G = ((num >> 8) & 0x00FF) + amt;
        const B = (num & 0x0000FF) + amt;
        return "#" + (
            0x1000000 +
            (R < 255 ? (R < 0 ? 0 : R) : 255) * 0x10000 +
            (G < 255 ? (G < 0 ? 0 : G) : 255) * 0x100 +
            (B < 255 ? (B < 0 ? 0 : B) : 255)
        ).toString(16).slice(1);
    }

        }

        const allF = cachedAllFeatures{{ tab_name }};
        const entitiesById = {};
        {{ tab_name }}Data.tableData.forEach(e => entitiesById[e.id] = e);

        const filteredIds = new Set(filteredIDdata{{ tab_name }});

        const filtByType  = {};

            if (!filteredIds.has(eid)) return;

            const cat = getGeomCategory{{ tab_name }}(f.geometry.type);
            if (cat !== type) return;

            const entity = entitiesById[eid];
            if (entity && entity.type_id) {
                filtByType[entity.type_id] = (filtByType[entity.type_id] || 0) + 1;
            }
        });

        const tree = {{ tab_name }}Data.treeData;
        const fragment = document.createDocumentFragment();

        // if (btnRow && !targetList) btnRow.classList.remove('d-none');

        Object.keys(tree).forEach((classKey, branchIdx) => {
            const classNodes = tree[classKey];
            if (!Array.isArray(classNodes)) return;

            const branchHasGeom = classNodes.some(node => {
                const check = (n) => {
                    if ((filtByType[n.id] || 0) > 0) return true;
                    if (n.children) return n.children.some(check);
                    return false;
                };
                return check(node);

                    picker.onclick = (e) => e.stopPropagation();
                    picker.onchange = (e) => {
                        e.stopPropagation();
                        multiTypeColors{{ tab_name }}[type][node.id] = picker.value;
                        applyMultiColor{{ tab_name }}('type');
                        if (window.syncTimeout{{ tab_name }}) clearTimeout(window.syncTimeout{{ tab_name }});
                        window.syncTimeout{{ tab_name }} = setTimeout(() => {
                            refreshMultiClassList{{ tab_name }}(type);
                        }, 100);
                    };
                    picker.oninput = (e) => {
                        e.stopPropagation();
                        multiTypeColors{{ tab_name }}[type][node.id] = picker.value;

                    if (node.children) {
                        node.children.forEach(c =>

                    }
                }
            };

            classNodes.forEach(node => processNode(node, 0, null, 0));

        list.appendChild(fragment);

            picker.onchange = (e) => {
                e.stopPropagation();
                multiClassColors{{ tab_name }}[type][cls] = picker.value;
                applyMultiColor{{ tab_name }}('class');
                if (window.syncTimeout{{ tab_name }}) clearTimeout(window.syncTimeout{{ tab_name }});
                window.syncTimeout{{ tab_name }} = setTimeout(() => {
                    refreshMultiClassList{{ tab_name }}(type);
                }, 100);
            };
            picker.oninput = (e) => {
                e.stopPropagation();
                multiClassColors{{ tab_name }}[type][cls] = picker.value;
                svgWrap.innerHTML =
                    makeMultiSvg{{ tab_name }}(type, picker.value);
                svgWrap.appendChild(picker);
                applyMultiColor{{ tab_name }}('class');
            };
            svgWrap.appendChild(picker);
            svgWrap.onclick = (e) => e.stopPropagation();

            const labelEl = document.createElement('span');
            labelEl.className = 'flex-grow-1 small';
            labelEl.textContent = formatClassName(cls);

            const badge = document.createElement('span');
            badge.className = 'badge text-bg-secondary ms-1';
            badge.textContent = count;

            li.appendChild(svgWrap);
            li.appendChild(labelEl);
            li.appendChild(badge);
            fragment.appendChild(li);
        });
        list.appendChild(fragment);
        // btnRow no longer used for list in sidebar
        // if (btnRow) btnRow.classList.remove('d-none');
    }

    function makeMultiLayerSvg{{ tab_name }}(type, modeArg) {
        const sel = document.getElementById(
            'multi-color-select-{{ tab_name }}');
        const mode = modeArg || (sel && sel.value) || 'class';
        let colors = [];
        if (mode === 'class') {
            colors = Object.values(multiClassColors{{ tab_name }}[type]);
        } else {
            colors = Object.values(multiTypeColors{{ tab_name }}[type]);
        }
        const c0 = colors[0] || '#888888';
        const c1 = colors[1] || c0;
        const s = multiSharedOpts{{ tab_name }}[type];
        if (type === 'Polygon') {
            return `<svg width="20" height="20" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="4" width="8" height="12" rx="1"
                      fill="${c0}" fill-opacity="${s.opacity}"
                      stroke="#004747"
                      stroke-width="${s.outlineWidth}"/>
                <rect x="10" y="4" width="8" height="12" rx="1"
                      fill="${c1}" fill-opacity="${s.opacity}"
                      stroke="#004747"
                      stroke-width="${s.outlineWidth}"/>
            </svg>`;
        }
        if (type === 'LineString') {
            return `<svg width="20" height="20" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                <polyline points="2,16 7,6 10,10"
                          fill="none" stroke="${c0}"
                          stroke-width="${s.lineWidth}"
                          stroke-linejoin="round"
                          stroke-linecap="round"/>
                <polyline points="10,10 13,14 18,4"
                          fill="none" stroke="${c1}"
                          stroke-width="${s.lineWidth}"
                          stroke-linejoin="round"
                          stroke-linecap="round"/>
            </svg>`;
        }
        const r = Math.min(s.radius, 9);
        return `<svg width="20" height="20" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
            <circle cx="6" cy="10" r="${Math.max(r - 2, 3)}"
                    fill="${c0}"
                    stroke="${s.strokeColor}"
                    stroke-width="${s.strokeWidth}"/>
            <circle cx="14" cy="10" r="${Math.max(r - 2, 3)}"
                    fill="${c1}"
                    stroke="${s.strokeColor}"
                    stroke-width="${s.strokeWidth}"/>
        </svg>`;
    }

    function applyMultiColor{{ tab_name }}(modeArg) {
        let type = multiCurrentLayerType{{ tab_name }};
        if (!type) {
            const modal = document.getElementById(
                'layer-style-modal-{{ tab_name }}');
            type = modal.dataset.layerType || null;
        }
        if (!type) { return; }

        const sel = document.getElementById(
            'multi-color-select-{{ tab_name }}');
        let mode = (modeArg && typeof modeArg === 'string') ? modeArg : null;
        if (!mode) {
            if (sel && sel.value) {
                mode = sel.value;
            } else {
                const tree = {{ tab_name }}Data.treeData;
                mode = (tree && Object.keys(tree).length > 0) ? 'type' : 'class';
            }
        }
        const m = map{{ tab_name }};
        const s = multiSharedOpts{{ tab_name }}[type];

        let colorExpr = '#888888';
        if (mode === 'class') {
            const colors = multiClassColors{{ tab_name }}[type];
            const classes = Object.keys(colors);
            if (classes.length === 0) {
                // Try to build them if missing
                buildMultiClassList{{ tab_name }}(type);
                const newColors = multiClassColors{{ tab_name }}[type];
                const newClasses = Object.keys(newColors);
                if (newClasses.length === 0) return;
                colorExpr = ['match', ['get', 'class']];
                newClasses.forEach(cls => {
                    colorExpr.push(cls, newColors[cls]);
                });
            } else {
                colorExpr = ['match', ['get', 'class']];
                classes.forEach(cls => {
                    colorExpr.push(cls, colors[cls]);
                });
            }
            colorExpr.push('#888888');
        } else if (mode === 'type') {
            const colors = multiTypeColors{{ tab_name }}[type];
            if (Object.keys(colors).length === 0) {
                // Try to build them if missing
                buildMultiTypeList{{ tab_name }}(type);
            }
            const eidMatches = [];
            {{ tab_name }}Data.tableData.forEach(e => {
                if (e.type_id && colors[String(e.type_id)]) {
                    eidMatches.push(e.id, colors[String(e.type_id)]);
                }
            });
            if (eidMatches.length === 0) { return; }
            colorExpr = ['match', ['get', 'id']];
            eidMatches.forEach(val => colorExpr.push(val));
            colorExpr.push('#888888');
        }

        if (type === 'Polygon') {
            if (m.getLayer('{{ tab_name }}-layer-fill')) {
                try {
                    m.setPaintProperty(
                        '{{ tab_name }}-layer-fill',
                        'fill-color', colorExpr);
                    m.setPaintProperty(
                        '{{ tab_name }}-layer-fill',
                        'fill-opacity', (s.opacity !== null && s.opacity !== undefined) ? s.opacity : 0.5);
                } catch (e) {
                    console.error('Error setting Polygon paint props', e);
                }
            }
            if (m.getLayer('{{ tab_name }}-layer-outline')) {
                try {
                    m.setPaintProperty(
                        '{{ tab_name }}-layer-outline',
                        'line-color', (mode === 'class' ? '#004747' : '#000000'));
                    m.setPaintProperty(
                        '{{ tab_name }}-layer-outline',
                        'line-width', (s.outlineWidth !== null && s.outlineWidth !== undefined) ? s.outlineWidth : 1.5);
                } catch (e) {
                    console.error('Error setting Polygon outline props', e);
                }
            }
        } else if (type === 'LineString') {
            if (m.getLayer('{{ tab_name }}-layer-line')) {
                try {
                    m.setPaintProperty(
                        '{{ tab_name }}-layer-line',
                        'line-color', colorExpr);
                    m.setPaintProperty(
                        '{{ tab_name }}-layer-line',
                        'line-width', (s.lineWidth !== null && s.lineWidth !== undefined) ? s.lineWidth : 2.5);
                    m.setPaintProperty(
                        '{{ tab_name }}-layer-line',
                        'line-opacity', (s.opacity !== null && s.opacity !== undefined) ? s.opacity : 1);
                } catch (e) {
                    console.error('Error setting LineString paint props', e);
                }
            }
        } else if (type === 'Point') {
            [
                '{{ tab_name }}-layer-circle',
                '{{ tab_name }}-layer-representative-points'
            ].forEach(lid => {
                if (m.getLayer(lid)) {
                    try {
                        m.setPaintProperty(
                            lid, 'circle-color', colorExpr);
                        m.setPaintProperty(
                            lid, 'circle-radius', (s.radius !== null && s.radius !== undefined) ? s.radius : 7);
                        m.setPaintProperty(
                            lid, 'circle-opacity', (s.opacity !== null && s.opacity !== undefined) ? s.opacity : 1);
                        m.setPaintProperty(
                            lid, 'circle-stroke-width', (s.strokeWidth !== null && s.strokeWidth !== undefined) ? s.strokeWidth : 1);
                    } catch (e) {
                        console.error('Error setting Point paint props for ' + lid, e);
                    }
                }
            });
        }
        const def = layerDefs{{ tab_name }}.find(
            d => d.type === type);
        if (def) {
            def.svg = makeMultiLayerSvg{{ tab_name }}(type, mode);
            const layerList = document.getElementById(
                'layer-list-{{ tab_name }}');
            layerList.querySelectorAll(
                    '.layer-info-btn').forEach(span => {
                const lbl = span.querySelector('span.flex-grow-1');
                if (lbl && lbl.textContent === def.label) {
                    const svgWrapper =
                        span.querySelector('span.flex-shrink-0');
                    if (svgWrapper) {
                        svgWrapper.innerHTML = def.svg;
                    }
                }
            });
        }
    }

    window.applyMultiColor{{ tab_name }} = applyMultiColor{{ tab_name }};

    function resetMultiColor{{ tab_name }}() {
        const type = multiCurrentLayerType{{ tab_name }};
        if (!type) { return; }
        multiClassColors{{ tab_name }}[type] = {};
        multiTypeColors{{ tab_name }}[type] = {};
        multiPaletteIdx{{ tab_name }} = 0;
        const defaults = {
            Polygon:    { outlineWidth: 1.5, opacity: 0.5 },
            LineString: { lineWidth: 2.5,    opacity: 1   },
            Point:      { radius: 7, strokeWidth: 1,
                          strokeColor: '#000000', opacity: 1 }
        };
        Object.assign(
            multiSharedOpts{{ tab_name }}[type], defaults[type]);
        if (type === 'Polygon') {
            applyPolygonStyle{{ tab_name }}();
            refreshLayerListSvg{{ tab_name }}('Polygon');
        } else if (type === 'LineString') {
            applyLineStringStyle{{ tab_name }}();
            refreshLayerListSvg{{ tab_name }}('LineString');
        } else if (type === 'Point') {
            applyPointStyle{{ tab_name }}();
            refreshLayerListSvg{{ tab_name }}('Point');
        }
        const sel = document.getElementById(
            'multi-color-select-{{ tab_name }}');
        if (sel && sel.value === 'class') buildMultiClassList{{ tab_name }}(type);
        else if (sel && sel.value === 'type') buildMultiTypeList{{ tab_name }}(type);
    }

    const modalEl = document.getElementById(
        'layer-style-modal-{{ tab_name }}');

    const multiApplyBtn = document.getElementById('multi-apply-btn-{{ tab_name }}');
    if (multiApplyBtn) multiApplyBtn.addEventListener('click', applyMultiColor{{ tab_name }});
    const multiResetBtn = document.getElementById('multi-reset-btn-{{ tab_name }}');
    if (multiResetBtn) multiResetBtn.addEventListener('click', resetMultiColor{{ tab_name }});

    const multiColorSelect = document.getElementById('multi-color-select-{{ tab_name }}');
    if (multiColorSelect) {
        multiColorSelect.addEventListener('change', function () {
            const layerType = modalEl.dataset.layerType || null;
            if (this.value === 'class') {
                buildMultiClassList{{ tab_name }}(layerType);
            } else if (this.value === 'type') {
                buildMultiTypeList{{ tab_name }}(layerType);
            } else {
                const multiClassList = document.getElementById('multi-class-list-{{ tab_name }}');
                if (multiClassList) multiClassList.innerHTML = '';
                const multiBtnRow = document.getElementById('multi-btn-row-{{ tab_name }}');
                if (multiBtnRow) multiBtnRow.classList.add('d-none');
                buildMultiSharedOpts{{ tab_name }}(null);
            }
        });
    }
    function initLayerStyle{{ tab_name }}() {
        const types = ['Point', 'Polygon', 'LineString'];
        const tree = {{ tab_name }}Data.treeData;
        const hasTree = tree && Object.keys(tree).length > 0;
        const classes = classList{{ tab_name }};
        const hasClasses = classes && classes.length >= 1;

        if (!hasTree && !hasClasses) return;

        // Determine mode: prioritize type if tree data exists
        const mode = hasTree ? 'type' : 'class';

        types.forEach(t => {
            // Only apply if there are geometries of this type
            const hasGeom = cachedAllFeatures{{ tab_name }}.some(f =>
                getGeomCategory{{ tab_name }}(f.geometry.type) === t
            );
            if (!hasGeom) return;

            multiCurrentLayerType{{ tab_name }} = t;
            if (mode === 'type') {
                // Ensure colors are generated
                buildMultiTypeList{{ tab_name }}(t);
                applyMultiColor{{ tab_name }}('type');
            } else {
                // Ensure colors are generated
                buildMultiClassList{{ tab_name }}(t);
                applyMultiColor{{ tab_name }}('class');
            }

            // Also populate sidebar legend if it exists and is expanded
            const sidebarLegend = document.getElementById(`layer-legend-{{ tab_name }}-${t}`);
            if (sidebarLegend && !sidebarLegend.classList.contains('d-none')) {
                if (mode === 'type') {
                    buildMultiTypeList{{ tab_name }}(t, sidebarLegend);
                } else {
                    buildMultiClassList{{ tab_name }}(t, sidebarLegend);
                }
            }
        });

        // Initialize visibility
        applyLayerVisibility{{ tab_name }}();

        // Ensure current type is set back to null if modal is not open,
        // but don't clear the color caches!
        if (!modalEl.classList.contains('show')) {
            buildMultiSharedOpts{{ tab_name }}(null);
            multiCurrentLayerType{{ tab_name }} = null;
        }
    }

    modalEl.addEventListener('show.bs.modal', () => {
        buildMultiColorSelect{{ tab_name }}();
        const layerType = modalEl.dataset.layerType || null;
        if (layerType) multiCurrentLayerType{{ tab_name }} = layerType;
        const titleEl = modalEl.querySelector('.modal-title');
        if (titleEl && layerType) {
            titleEl.textContent = 'Layer Style – ' + layerType;
        }
        updateOverview{{ tab_name }}(
            cachedAllFeatures{{ tab_name }},
            cachedFilteredFeatures{{ tab_name }},
            layerType);
        if (layerType) {
            buildSingleColorForm{{ tab_name }}(layerType);
        }
        // Set default selection to Types if available, otherwise Classes
        const multiSel = document.getElementById(
            'multi-color-select-{{ tab_name }}');
        if (multiSel) {
            const hasType = [...multiSel.options].some(o => o.value === 'type');
            const hasClass = [...multiSel.options].some(o => o.value === 'class');

            if (hasType) {
                multiSel.value = 'type';
                // buildMultiTypeList{{ tab_name }}(layerType); // No longer needed for modal
                applyMultiColor{{ tab_name }}();
            } else if (hasClass) {
                multiSel.value = 'class';
                // buildMultiClassList{{ tab_name }}(layerType); // No longer needed for modal
                applyMultiColor{{ tab_name }}();
            } else {
                multiSel.value = '';
                buildMultiSharedOpts{{ tab_name }}(null);
            }
        }
    });
    modalEl.addEventListener('shown.bs.modal', () => {
        modalEl.querySelectorAll('[data-bs-toggle-tooltip]')
            .forEach(el => {
                if (!bootstrap.Tooltip.getInstance(el)) {
                    new bootstrap.Tooltip(el, {trigger: 'hover'});
                }
            });
    });

    // Expose functions to global scope for map_js.html
    window.initLayerStyle{{ tab_name }} = initLayerStyle{{ tab_name }};
    window.applyMultiColor{{ tab_name }} = applyMultiColor{{ tab_name }};
    window.updateOverview{{ tab_name }} = updateOverview{{ tab_name }};
    window.updateLayerList{{ tab_name }} = updateLayerList{{ tab_name }};
    window.openStyleSidebar{{ tab_name }} = openStyleSidebar{{ tab_name }};
    window.closeStyleSidebar{{ tab_name }} = closeStyleSidebar{{ tab_name }};
    window.toggleStyleSidebar{{ tab_name }} = toggleStyleSidebar{{ tab_name }};
    window.buildMultiTypeList{{ tab_name }} = buildMultiTypeList{{ tab_name }};
    window.buildMultiClassList{{ tab_name }} = buildMultiClassList{{ tab_name }};

    // Auto-open on large screens
    if (window.innerWidth >= 1200) {
        // Delay slightly to ensure layout and map (if any) are ready
        setTimeout(() => {
            const activeLink = document.querySelector(
                '#nav-sidebar .nav-link.active');
            const activeTab = activeLink
                ? activeLink.id.replace(/^tab-/, '')
                : null;
            const viewBtn = document.getElementById(
                `{{ tab_name }}-map-btn`);
            const isMapView = viewBtn && viewBtn.classList.contains('active');

            if (activeTab === '{{ tab_name }}' && isMapView) {
                openStyleSidebar{{ tab_name }}();
            }
        }, 1000);
    }

})();
</script>
{% endif %}
