<form action="{{ url_for('update_type_divisions') }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div id="type-divisions-container" class="row row-cols-1 row-cols-md-2 g-4 mb-4"
       data-division-counter="{{ settings.type_divisions.items() | length }}"
       data-label-placeholder="{{ _('Division Label') }}"
       data-icon-type-label="{{ _('Icon Type') }}"
       data-bootstrap-icon-label="{{ _('Bootstrap Icon Class') }}"
       data-svg-icon-label="{{ _('SVG Icon File') }}"
       data-preview-label="{{ _('Preview:') }}"
       data-type-ids-label="{{ _('Type IDs (comma-separated)') }}">
    {% for label, division in settings.type_divisions.items() %}
      <div class="col" data-label="{{ label }}" data-division-index="{{ loop.index0 }}">
        <div class="card h-100 shadow-sm border rounded">
          <div class="card-header bg-light d-flex justify-content-between align-items-center py-2">
            <div class="input-group input-group-sm w-75">
              <span class="input-group-text bg-white"><i class="bi bi-tag-fill text-muted"></i></span>
              <input type="text" class="form-control fw-bold"
                     name="label_{{ loop.index0 }}" value="{{ label }}"
                     required placeholder="{{ _('Division Label') }}">
            </div>
            <button type="button" class="btn btn-outline-danger btn-sm"
                    onclick="removeDivision(this)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
          <div class="card-body p-3">
            <div class="row g-2 align-items-end mb-3">
              <div class="col-md-5">
                <label class="form-label text-muted small fw-bold mb-1">{{ _('Icon Type') }}</label>
                <select class="form-select form-select-sm"
                        name="icon_type_{{ loop.index0 }}"
                        id="icon_type_{{ loop.index0 }}"
                        onchange="toggleIconType({{ loop.index0 }})">
                  <option value="css" {% if division.icon_type == 'css' %}selected{% endif %}>CSS Class</option>
                  <option value="img" {% if division.icon_type == 'img' %}selected{% endif %}>SVG Icon</option>
                  <option value="" {% if not division.icon_type %}selected{% endif %}>None</option>
                </select>
              </div>
              <div class="col-md-7">
                <div id="css_container_{{ loop.index0 }}" class="d-none">
                  <label class="form-label text-muted small fw-bold mb-1">
                    {{ _('Bootstrap Icon Class') }}
                  </label>
                  <input type="text" class="form-control form-select-sm"
                         id="css_input_{{ loop.index0 }}"
                         name="icon_value_{{ loop.index0 }}"
                         value="{{ division.icon_value or '' }}"
                         oninput="updatePreview({{ loop.index0 }})"
                         placeholder="e.g. bi-tags">
                </div>
                <div id="img_container_{{ loop.index0 }}" class="d-none">
                  <label class="form-label text-muted small fw-bold mb-1">
                    {{ _('SVG Icon File') }}
                  </label>
                  <select class="form-select form-select-sm"
                          id="img_select_{{ loop.index0 }}"
                          name="icon_value_{{ loop.index0 }}"
                          onchange="updatePreview({{ loop.index0 }})">
                    <option value="">{{ _('Select Icon...') }}</option>
                    {% for icon in admin_instance.icons %}
                      <option value="{{ icon.filename }}"
                              data-url="{{ get_icon_url(icon.filename) }}"
                              {% if division.icon_type == 'img' and division.icon_value == icon.filename %}
                                selected
                              {% endif %}>
                        {{ icon.filename }}
                      </option>
                    {% endfor %}
                  </select>
                </div>
              </div>
            </div>

            <div class="d-flex align-items-center gap-3 mb-3 p-2 bg-light rounded border"
                 style="min-height: 48px;">
              <span class="text-muted small fw-bold">{{ _('Preview:') }}</span>
              <div id="preview_container_{{ loop.index0 }}"
                   class="d-flex align-items-center justify-content-center text-primary"
                   style="width: 32px; height: 32px;"></div>
            </div>

            <div class="mb-0">
              <label class="form-label text-muted small fw-bold mb-1">
                {{ _('Type IDs (comma-separated)') }}
              </label>
              <input type="text" class="form-control form-select-sm"
                     name="ids_{{ loop.index0 }}"
                     value="{{ division.ids|join(', ') }}"
                     placeholder="e.g. 101, 102">
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-success" onclick="addDivision()">
      <i class="bi bi-plus-circle me-1"></i>{{ _('Add Division') }}
    </button>
    <button type="submit" class="btn btn-primary px-4">
      <i class="bi bi-save me-1"></i>{{ _('SAVE CHANGES') }}
    </button>
  </div>
</form>

<template id="type-division-icon-options">
  <option value="">{{ _('Select Icon...') }}</option>
  {% for icon in admin_instance.icons %}
    <option value="{{ icon.filename }}"
            data-url="{{ get_icon_url(icon.filename) }}">{{ icon.filename }}</option>
  {% endfor %}
</template>
