[pytest]
testpaths = tests
python_files = test_*.py
addopts = -W default -ra -q --no-header -m "not slow"
# To run in parallel, add: -n auto --dist loadfile
# Note: parallel execution may cause database conflicts in some tests.
# To enable coverage, run: pytest --cov=histarchexplorer --cov-report=term-missing
markers =
    slow: mark test as slow (skipped by default)
